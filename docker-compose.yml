# MajSpirit 本地开发环境：服务端 + PostgreSQL
#
#   docker compose up --build
#
# 任务书 §1 提到「项目能在 Linux 系统上运行的话也许是个加分项」，
# 这套编排同时也是验证 Linux 可运行性的手段。

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      MAJSPIRIT_ADDR: ":8080"
      MAJSPIRIT_DATABASE_URL: "postgres://majspirit:majspirit@db:5432/majspirit?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: majspirit
      POSTGRES_PASSWORD: majspirit
      POSTGRES_DB: majspirit
    ports:
      # 宿主机 15432 → 容器 5432。
      #
      # 不能映射到宿主机 5432：Windows 把 5390–5489 划给了 Hyper-V/WSL2 的网络栈
      # （`netsh int ipv4 show excludedportrange protocol=tcp` 可查），在那儿 bind
      # 会得到 Permission denied 而不是 Address already in use。
      #
      # 容器内部仍是标准的 5432，所以上面 app 连的 db:5432 不变。
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U majspirit -d majspirit"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
